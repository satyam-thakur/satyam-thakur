name: Generate Articles Index

on:
  push:
    paths:
      - "content/articles/**/*.md"
      - "tools/generate-articles-index.js"
      - ".github/workflows/articles-index.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate-index:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generate article index
        run: node tools/generate-articles-index.js

      - name: Commit updated index
        run: |
          if git diff --quiet -- content/articles/articles-index.json; then
            echo "No index changes to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content/articles/articles-index.json
          git commit -m "chore: update articles index"
          git push
