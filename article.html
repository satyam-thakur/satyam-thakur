<!DOCTYPE html>
<html lang="en" itemscope itemtype="http://schema.org/Article">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0b0f17">
  <meta name="color-scheme" content="dark">
  <title>Article | Satyam Thakur</title>
  <link rel="canonical" href="article.html">
  <link rel="alternate" hreflang="en" href="article.html">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Inter:400,400i,700,700i&display=swap">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
  <link rel="stylesheet" href="css/wowchemy.32e2e32cf1a4c1ea152e519f8b1fda79.css">
  <link rel="stylesheet" href="css/custom.css?v=6">
  <script>
    document.addEventListener('DOMContentLoaded', function() {
      const savedTheme = localStorage.getItem('wcTheme');
      const isDarkMode = savedTheme === '1' || savedTheme === 'dark' || (!savedTheme && window.matchMedia('(prefers-color-scheme: dark)').matches);
      if (isDarkMode) {
        document.body.classList.add('dark');
        document.body.classList.remove('light');
      } else {
        document.body.classList.remove('dark');
        document.body.classList.add('light');
      }
      if (!savedTheme) {
        localStorage.setItem('wcTheme', isDarkMode ? '1' : '0');
      }
    });
  </script>
</head>

<body>
  <div class="wrapper">
    <nav class="navbar navbar-expand-lg navbar-light compensate-for-scrollbar fixed-top" id="navbar-main">
      <div class="container-xl">
        <div class="d-none d-lg-inline-flex">
          <a class="navbar-brand" href="index.html">Satyam Thakur</a>
        </div>
        <button type="button" class="navbar-toggler" data-toggle="collapse" data-target="#navbar-content"
          aria-controls="navbar-content" aria-expanded="false" aria-label="Toggle navigation">
          <span><i class="fas fa-bars"></i></span>
        </button>
        <div class="navbar-brand-mobile-wrapper d-inline-flex d-lg-none">
          <a class="navbar-brand" href="index.html">Stay with me!</a>
        </div>
        <div class="navbar-collapse main-menu-item collapse justify-content-start" id="navbar-content">
          <div id="navbar-links"></div>
          <script src="js/navbar.js"></script>
        </div>
        <ul class="nav-icons navbar-nav flex-row ml-auto d-flex pl-md-2">
          <li class="nav-item theme-toggle">
            <a href="#" class="nav-link js-set-theme-auto" aria-label="Toggle theme">
              <i class="fas fa-moon" aria-hidden="true"></i>
            </a>
          </li>
        </ul>
      </div>
    </nav>

    <main class="main-content">
      <div class="container article-shell">
        <div class="row">
          <div class="col-12">
            <div class="py-4">
              <h1 class="mb-2" id="article-title">Loading article...</h1>
              <p class="mb-4 article-meta" id="article-meta"></p>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12">
            <div class="blog-card article-status" id="article-status">Loading content...</div>
            <article id="article-content" class="article-content" hidden></article>
          </div>
        </div>
      </div>
    </main>

    <div class="page-footer">
      <div class="container">
        <footer class="site-footer">
          <p class="powered-by copyright-license-text">© 2025 Satyam Thakur</p>
          <p class="powered-by">Network Development Engineer</p>
          <p class="powered-by">
            <a href="https://www.linkedin.com/in/satyam-thakur-6265b4197/" target="_blank" rel="noopener">LinkedIn</a>
            ·
            <a href="https://github.com/satyam-thakur" target="_blank" rel="noopener">GitHub</a>
            ·
            <a href="blog.html">Blog</a>
            ·
            <a href="mailto:infothakur999@gmail.com">Email</a>
          </p>
        </footer>
      </div>
    </div>
  </div>

  <script src="js/vendor-bundle.min.f64289d8217e08e3afcd597d60836062.js"></script>
  <script src="js/wowchemy-headroom.db4755770454eb63685f8de785c0a172.js"></script>
  <script src="js/wowchemy-init.min.3a6bdbdff5d8a89d6e651adb3deec035.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
  <script src="js/article-renderer.js?v=1"></script>

  <script>
    (function() {
      const themeButton = document.querySelector('.js-set-theme-auto');
      if (!themeButton) return;
      themeButton.addEventListener('click', function(e) {
        e.preventDefault();
        const isDark = document.body.classList.toggle('dark');
        localStorage.setItem('wcTheme', isDark ? '1' : '0');
      });
    })();

    document.addEventListener('DOMContentLoaded', function() {
      if (window.ArticleRenderer) {
        window.ArticleRenderer.initArticlePage();
      }
    });
  </script>
</body>
</html>
